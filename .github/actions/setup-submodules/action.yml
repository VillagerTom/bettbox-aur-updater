name: Setup submodules
description: Write the AUR SSH key to ~/.ssh and initialize submodules over SSH

inputs:
  ssh-key:
    description: AUR SSH private key (AUR_SSH_PRIVATE_KEY secret)
    required: true

runs:
  using: composite
  steps:
    - name: Write AUR SSH key
      shell: bash
      env:
        AUR_SSH_PRIVATE_KEY: ${{ inputs.ssh-key }}
      run: |
        set -euo pipefail
        mkdir -p -m 0700 ~/.ssh
        ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
        echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur

    - name: Init submodules
      shell: bash
      env:
        # ssh resolves ~/.ssh from the passwd home (/root in the container), not
        # $HOME (/github/home), so known_hosts written by the step above would
        # be missed. Explicit absolute paths keep both in $HOME.
        GIT_SSH_COMMAND: ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts
      run: |
        # Container jobs (update-aur) run git as root against a workspace owned
        # by the runner user, which git's safe.directory check rejects. Mark it
        # safe before touching submodules; harmless on runner-hosted jobs.
        git config --global --add safe.directory '*'
        git submodule update --init --recursive