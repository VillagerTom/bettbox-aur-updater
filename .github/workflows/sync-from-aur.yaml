name: Sync from AUR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup submodules
        uses: ./.github/actions/setup-submodules
        with:
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Update submodules to latest AUR HEAD
        env:
          GIT_SSH_COMMAND: ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts
        run: |
          set -euo pipefail
          {
            echo "chore: sync AUR submodules to latest"
            echo ""
          } > /tmp/aur-commit-msg.txt
          for sub in aur/*/; do
            cd "$sub"
            old_head=$(git rev-parse HEAD)
            # No error masking here. `git checkout` reports both success and
            # failure on stderr, so `2>/dev/null || true` turned a broken fetch
            # or checkout into a silent "AUR has nothing new" — the parent
            # pointer then stayed behind AUR while the job still went green.
            # Fetch the branch explicitly and pin the worktree to FETCH_HEAD so
            # a submodule stays detached at AUR HEAD (matching how
            # `git submodule update` leaves it) and any failure aborts the job.
            git fetch --prune origin master
            git reset --hard FETCH_HEAD
            new_head=$(git rev-parse HEAD)
            if [ "$old_head" != "$new_head" ]; then
              {
                echo "$sub"
                git log --oneline "$old_head..$new_head" 2>/dev/null | sed 's/^/  /'
                echo ""
              } >> /tmp/aur-commit-msg.txt
            fi
            cd ../..
          done

      - name: Commit updated pointer
        uses: ./.github/actions/commit-submodule-pointers
        with:
          message-file: /tmp/aur-commit-msg.txt
          committer-name: ${{ secrets.GIT_NAME }}
          committer-email: ${{ secrets.GIT_EMAIL }}
